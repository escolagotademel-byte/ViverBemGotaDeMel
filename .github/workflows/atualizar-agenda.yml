name: Atualizar agenda cultural

on:
  workflow_dispatch:
  schedule:
    # Executa diariamente às 10h15 UTC, equivalente a 7h15 no horário de Brasília.
    - cron: "15 10 * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-agenda-cultural
  cancel-in-progress: false

jobs:
  atualizar-eventos:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
  run: |
    python -m pip install --upgrade pip
    pip install requests beautifulsoup4 python-dateutil dateparser lxml

      - name: Consultar APPAI e SESC
        run: python scripts/atualizar_eventos.py

      - name: Verificar alterações
        id: verificar
        run: |
          if git diff --quiet -- data/eventos.json; then
            echo "alterado=false" >> "$GITHUB_OUTPUT"
          else
            echo "alterado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Salvar agenda atualizada
        if: steps.verificar.outputs.alterado == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eventos.json
          git commit -m "Atualiza agenda cultural automaticamente"
          git push
