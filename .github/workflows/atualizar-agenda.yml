name: Atualizar agenda cultural

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  atualizar-eventos:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-dateutil dateparser lxml

      - name: Consultar APPAI e SESC
        run: python scripts/atualizar_eventos.py

      - name: Verificar alterações
        run: git status

      - name: Salvar agenda atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eventos.json
          git diff --cached --quiet || git commit -m "Atualizar agenda cultural"
          git push
