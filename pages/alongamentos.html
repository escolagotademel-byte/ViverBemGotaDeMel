<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6c344"><title>Alongamentos | Viver Bem</title><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js" defer></script></head><body>
<header class="page-topbar"><a class="back-link" href="../index.html" aria-label="Voltar">‹</a><div class="page-brand"><img class="mini-logo" src="../assets/logo-gota-de-mel.png" alt=""><div><h1>Alongamentos</h1><small>Viver Bem</small></div></div></header>
<main class="page-content stretch-page"><section class="intro-card compact-intro"><div class="intro-icon">🤸</div><h2>Alongamentos</h2><p>Movimentos simples, com ilustrações e setas para orientar a posição.</p></section>
<section class="stretch-grid">

<button class="stretch-card" type="button" data-stretch data-title="Pescoço para o lado" data-instruction="Mantenha os ombros relaxados e incline a cabeça suavemente para o lado." data-switch="Troque o lado e repita."><svg class="stretch-illustration" viewBox="0 0 220 210" role="img" aria-label="Pessoa inclinando a cabeça para o lado"><g class="person"><circle cx="110" cy="38" r="17"/><path class="hair" d="M94 37q3-22 20-17q15 4 13 22q-7-8-14-10q-9 8-19 5"/><path class="shirt" d="M84 66q26-18 52 0l8 55H76z"/><path class="shorts" d="M76 121h68l-7 28h-20l-7-17-8 17H82z"/><path d="M88 72L58 112M132 72l25 42M92 149l-15 49M128 149l16 49"/><path d="M110 55q20 5 26 19"/></g><path class="motion" d="M139 22q25 16 19 47"/><path class="motion" d="M151 61l7 10 7-10"/></svg><strong>Pescoço</strong><span>Inclinação lateral suave.</span><em>Começar ›</em></button>

<button class="stretch-card" type="button" data-stretch data-title="Tríceps" data-instruction="Leve um braço por trás da cabeça e puxe o cotovelo suavemente com a outra mão." data-switch="Troque o braço e repita."><svg class="stretch-illustration" viewBox="0 0 220 210" role="img" aria-label="Pessoa alongando o tríceps"><g class="person"><circle cx="110" cy="39" r="17"/><path class="hair" d="M94 40q0-24 18-20q18 2 14 24q-14-4-32-4"/><path class="shirt" d="M82 67q28-18 56 0l7 55H75z"/><path class="shorts" d="M75 122h70l-8 28h-20l-7-17-8 17H82z"/><path d="M88 72l16-28 19-11M132 71l-10-27-19-11M92 150l-14 48M128 150l15 48"/></g><path class="motion" d="M72 58q-7-34 27-43"/><path class="motion" d="M91 10l10 5-8 8"/></svg><strong>Braços</strong><span>Alongamento de tríceps.</span><em>Começar ›</em></button>

<button class="stretch-card" type="button" data-stretch data-title="Lateral do tronco" data-instruction="Eleve um braço e incline o tronco para o lado sem girar o corpo." data-switch="Volte ao centro, troque o braço e repita."><svg class="stretch-illustration" viewBox="0 0 220 210" role="img" aria-label="Pessoa inclinando o tronco para o lado"><g class="person"><circle cx="102" cy="39" r="17"/><path class="hair" d="M86 41q1-24 18-20q17 3 14 23q-12-7-32-3"/><path class="shirt" d="M79 65q26-15 50 2l20 48-60 18z"/><path class="shorts" d="M88 128l62-18 3 28-22 7-11-12-5 18-20 5z"/><path d="M83 74L45 117M125 66l35-47M103 151l-3 48M136 143l19 48"/></g><path class="motion" d="M48 72q18-45 65-58"/><path class="motion" d="M105 8l11 5-8 9"/></svg><strong>Tronco lateral</strong><span>Abra a lateral do corpo.</span><em>Começar ›</em></button>

<button class="stretch-card" type="button" data-stretch data-title="Posterior da coxa" data-instruction="Afaste as pernas e desça o tronco somente até onde for confortável." data-switch="Respire fundo e retorne devagar."><svg class="stretch-illustration" viewBox="0 0 220 210" role="img" aria-label="Pessoa inclinada à frente com pernas afastadas"><g class="person"><circle cx="110" cy="112" r="16"/><path class="hair" d="M94 113q2-22 19-18q14 3 13 20q-12-6-32-2"/><path class="shirt" d="M82 77q30-11 57 6l-13 49-60-14z"/><path class="shorts" d="M66 118l60 14-10 24-18-4-8-16-14 11-18-5z"/><path d="M78 81L39 42M133 86l45-35M75 143l-48 54M111 153l66 44"/></g><path class="motion" d="M64 39q35 5 48 37"/><path class="motion" d="M102 69l11 8 1-13"/></svg><strong>Parte posterior</strong><span>Pernas afastadas e tronco à frente.</span><em>Começar ›</em></button>

<button class="stretch-card" type="button" data-stretch data-title="Panturrilha" data-instruction="Apoie as mãos, leve uma perna para trás e mantenha o calcanhar no chão." data-switch="Troque a perna e repita."><svg class="stretch-illustration" viewBox="0 0 220 210" role="img" aria-label="Pessoa alongando a panturrilha"><path class="wall" d="M188 20v180"/><g class="person"><circle cx="112" cy="43" r="16"/><path class="hair" d="M96 45q0-22 17-19q15 3 13 21q-13-7-30-2"/><path class="shirt" d="M91 68q25-13 45 5l17 45-55 18z"/><path class="shorts" d="M98 132l55-18 5 23-20 6-12-9-5 15-19 5z"/><path d="M133 77l49 15M137 87l45 17M111 151l-8 47M139 143l-60 55"/></g><path class="motion" d="M79 184h-31"/><path class="motion" d="M57 177l-10 7 10 7"/></svg><strong>Panturrilha</strong><span>Calcanhar de trás no chão.</span><em>Começar ›</em></button>

<button class="stretch-card" type="button" data-stretch data-title="Quadríceps" data-instruction="Segure um pé atrás do corpo e aproxime o calcanhar do glúteo, mantendo os joelhos juntos." data-switch="Troque a perna e repita."><svg class="stretch-illustration" viewBox="0 0 220 210" role="img" aria-label="Pessoa segurando um pé atrás"><g class="person"><circle cx="106" cy="37" r="17"/><path class="hair" d="M90 39q1-24 18-20q17 3 14 23q-13-7-32-3"/><path class="shirt" d="M80 65q28-17 55 1l8 55H73z"/><path class="shorts" d="M73 121h70l-8 28h-20l-8-16-8 16H80z"/><path d="M87 73L61 111M132 72l18 55-27 26M91 149l-5 49M127 149l17 22-18 20"/></g><path class="motion" d="M164 186q17-21 3-46"/><path class="motion" d="M162 149l5-11 8 9"/></svg><strong>Quadríceps</strong><span>Pé atrás, joelhos próximos.</span><em>Começar ›</em></button>

<button class="stretch-card" type="button" data-stretch data-title="Ombros e costas" data-instruction="Entrelace as mãos à frente e empurre suavemente, arredondando a parte alta das costas." data-switch="Relaxe os braços e repita."><svg class="stretch-illustration" viewBox="0 0 220 210" role="img" aria-label="Pessoa com braços estendidos à frente"><g class="person"><circle cx="83" cy="43" r="16"/><path class="hair" d="M68 45q1-22 17-19q15 3 13 21q-12-6-30-2"/><path class="shirt" d="M64 68q24-13 43 5l16 50-55 14z"/><path class="shorts" d="M68 134l55-14 5 25-20 5-11-11-4 16-20 5z"/><path d="M101 77l58 22M100 88l59 11M80 155l-5 43M111 150l17 48"/></g><path class="motion" d="M166 99h35"/><path class="motion" d="M192 92l10 7-10 7"/></svg><strong>Ombros e costas</strong><span>Empurre as mãos para frente.</span><em>Começar ›</em></button>

<button class="stretch-card" type="button" data-stretch data-title="Punhos" data-instruction="Estenda um braço e puxe os dedos suavemente para baixo com a outra mão." data-switch="Troque o braço e repita."><svg class="stretch-illustration" viewBox="0 0 220 210" role="img" aria-label="Pessoa alongando o punho"><g class="person"><circle cx="75" cy="44" r="16"/><path class="hair" d="M60 46q1-22 17-19q15 3 13 21q-12-6-30-2"/><path class="shirt" d="M55 69q24-14 45 4l12 53H50z"/><path class="shorts" d="M50 126h62l-7 25H87l-7-15-7 15H56z"/><path d="M94 78l67 14M95 89l66 3M66 151l-8 47M96 151l10 47M161 92v29M161 121l-20-22"/></g><path class="motion" d="M177 82q10 23 0 48"/><path class="motion" d="M171 121l6 10 8-8"/></svg><strong>Punhos</strong><span>Dedos puxados suavemente.</span><em>Começar ›</em></button>

</section></main>
