<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6c344">
  <title>Alongamentos | Viver Bem</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/app.js" defer></script>
</head>
<body>
<header class="page-topbar">
  <a class="back-link" href="../index.html" aria-label="Voltar">‹</a>
  <div class="page-brand"><img class="mini-logo" src="../assets/logo-gota-de-mel.png" alt=""><div><h1>Alongamentos</h1><small>Viver Bem</small></div></div>
</header>
<main class="page-content stretch-page">
  <section class="intro-card compact-intro"><div class="intro-icon">🤸</div><h2>Alongamentos</h2><p>Escolha um movimento e acompanhe a ilustração.</p></section>

  <section class="stretch-grid">
    <button class="stretch-card" type="button" data-stretch="neck" data-title="Pescoço" data-instruction="Incline a cabeça devagar para o lado, aproximando a orelha do ombro." data-switch="Troque o lado e repita o movimento.">
      <svg class="stretch-illustration" viewBox="0 0 240 180" role="img" aria-label="Pessoa inclinando a cabeça para o lado">
        <circle cx="112" cy="40" r="22" class="body-fill"/>
        <path d="M112 63v54M78 86h68M92 117l-17 43M132 117l17 43" class="body-line"/>
        <path d="M104 34c-19 4-30 16-35 31" class="move-arrow"/>
        <path d="M66 55l2 13 12-6" class="arrow-head"/>
      </svg>
      <strong>Pescoço</strong><span>Alivie a tensão lateral.</span><em>Começar ›</em>
    </button>

    <button class="stretch-card" type="button" data-stretch="shoulder" data-title="Ombros" data-instruction="Eleve os ombros em direção às orelhas e mantenha por alguns segundos." data-switch="Solte devagar e repita mais uma vez.">
      <svg class="stretch-illustration" viewBox="0 0 240 180" role="img" aria-label="Pessoa elevando os ombros">
        <circle cx="120" cy="38" r="21" class="body-fill"/>
        <path d="M120 61v58M82 91l38-18 38 18M92 118l-16 42M148 118l16 42" class="body-line"/>
        <path d="M82 104V74M158 104V74" class="move-arrow"/>
        <path d="M76 82l6-10 6 10M152 82l6-10 6 10" class="arrow-head"/>
      </svg>
      <strong>Ombros</strong><span>Solte a região dos ombros.</span><em>Começar ›</em>
    </button>

    <button class="stretch-card" type="button" data-stretch="wrist" data-title="Punhos" data-instruction="Estenda um braço e puxe os dedos suavemente para baixo com a outra mão." data-switch="Troque o braço e repita.">
      <svg class="stretch-illustration" viewBox="0 0 240 180" role="img" aria-label="Pessoa alongando o punho">
        <circle cx="82" cy="45" r="20" class="body-fill"/>
        <path d="M82 66v61M50 91l32-18 42 18M69 127l-13 35M95 127l13 35" class="body-line"/>
        <path d="M124 91h55M179 91v28M154 88l24 28" class="body-line"/>
        <path d="M192 85c7 13 7 27 0 40" class="move-arrow"/>
        <path d="M188 117l4 10 9-6" class="arrow-head"/>
      </svg>
      <strong>Punhos</strong><span>Relaxe mãos e antebraços.</span><em>Começar ›</em>
    </button>

    <button class="stretch-card" type="button" data-stretch="back" data-title="Costas" data-instruction="Entrelace as mãos à frente e empurre suavemente, arredondando a parte alta das costas." data-switch="Respire fundo e retorne devagar.">
      <svg class="stretch-illustration" viewBox="0 0 240 180" role="img" aria-label="Pessoa alongando as costas com os braços à frente">
        <circle cx="88" cy="42" r="20" class="body-fill"/>
        <path d="M88 64c15 16 17 37 11 61M69 125l-12 37M104 125l13 37" class="body-line"/>
        <path d="M92 76l50 27M91 88l51 15" class="body-line"/>
        <circle cx="146" cy="104" r="5" class="body-fill"/>
        <path d="M166 104h38" class="move-arrow"/>
        <path d="M194 98l10 6-10 6" class="arrow-head"/>
      </svg>
      <strong>Costas</strong><span>Abra a parte alta das costas.</span><em>Começar ›</em>
    </button>

    <button class="stretch-card" type="button" data-stretch="calf" data-title="Panturrilha" data-instruction="Apoie as mãos, leve uma perna para trás e mantenha o calcanhar no chão." data-switch="Troque a perna e repita.">
      <svg class="stretch-illustration" viewBox="0 0 240 180" role="img" aria-label="Pessoa alongando a panturrilha com uma perna atrás">
        <path d="M198 26v138" class="wall-line"/>
        <circle cx="119" cy="40" r="20" class="body-fill"/>
        <path d="M119 62l19 55M132 76l48 18M138 117l-6 44M138 117l-53 43" class="body-line"/>
        <path d="M91 153h-28" class="move-arrow"/>
        <path d="M72 147l-10 6 10 6" class="arrow-head"/>
      </svg>
      <strong>Panturrilha</strong><span>Alongue a parte de trás da perna.</span><em>Começar ›</em>
    </button>
  </section>
</main>

<div class="stretch-modal" data-stretch-modal hidden>
  <div class="stretch-modal-backdrop" data-close-stretch></div>
  <section class="stretch-modal-panel" role="dialog" aria-modal="true" aria-labelledby="stretch-title">
    <button class="stretch-modal-close" type="button" data-close-stretch aria-label="Fechar">×</button>
    <div class="stretch-modal-visual" data-stretch-visual></div>
    <h2 id="stretch-title" data-stretch-title>Alongamento</h2>
    <div class="stretch-timer"><span data-stretch-time>20</span><small>segundos</small></div>
    <p data-stretch-instruction></p>
    <button class="action-btn secondary" type="button" data-stretch-action>Começar</button>
    <button class="stretch-back" type="button" data-close-stretch>Voltar</button>
  </section>
</div>
<footer>Escola Gota de Mel</footer>
</body>
</html>
