<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Come-Come</title><link rel="stylesheet" href="../css/style.css"><style>.cc{max-width:540px;margin:auto;padding:14px}.cc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.cc-top h1{font-size:1.35rem;color:#28522d}.cc-top b{font-size:.82rem}.cc-board{width:100%;aspect-ratio:1;background:#173f33;border-radius:20px;display:block;touch-action:none}.cc-msg{text-align:center;background:#fff7d6;color:#28522d;padding:12px;border-radius:15px;margin:12px 0;font-weight:800}.cc-controls{display:grid;grid-template-columns:repeat(3,68px);justify-content:center;gap:8px}.cc-controls button{height:56px;border:0;border-radius:16px;background:#f6c344;font-size:1.45rem}.u{grid-column:2}.l{grid-column:1;grid-row:2}.d{grid-column:2;grid-row:2}.r{grid-column:3;grid-row:2}.cc-restart{display:block;margin:12px auto;border:0;border-radius:999px;background:#28522d;color:#fff;padding:10px 18px;font-weight:800}</style></head><body><main class="cc"><a class="back-link" href="../index.html">‹ Voltar</a><div class="cc-top"><h1>🎮 Come-Come</h1><b>Fase <span id="lv">1</span>/3 • ⭐ <span id="sc">0</span></b></div><canvas id="board" class="cc-board" width="480" height="480"></canvas><div id="msg" class="cc-msg">Colete todas as estrelas e fuja do inimigo! 👾</div><div class="cc-controls"><button class="u" data="0,-1">▲</button><button class="l" data="-1,0">◀</button><button class="d" data="0,1">▼</button><button class="r" data="1,0">▶</button></div><button id="restart" class="cc-restart">Recomeçar fase</button></main><script src="../js/come-come.js"></script></body></html>
