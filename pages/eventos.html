<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6c344">
<title>Eventos da Gota de Mel | Viver Bem</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="manifest" href="../manifest.json">
<style>
.company-event-page-list{display:grid;gap:10px;margin-top:14px}
.company-event-page-item{display:grid;grid-template-columns:minmax(94px,116px) minmax(0,1fr);gap:12px;align-items:start;padding:14px;background:#fff;border:1px solid rgba(40,82,45,.12);border-radius:16px;box-shadow:0 5px 16px rgba(40,55,75,.05)}
.company-event-page-date{font-size:.78rem;font-weight:900;color:#28522d;line-height:1.35}
.company-event-page-item strong{display:block;font-size:.92rem;line-height:1.35;color:#26342d}
.company-event-page-item small{display:block;margin-top:4px;font-size:.74rem;line-height:1.3;color:#68736d}
@media(max-width:390px){.company-event-page-item{grid-template-columns:1fr;gap:6px}}
</style>
</head>
<body>
<header class="page-topbar">
<a class="back-link" href="../index.html" aria-label="Voltar">‹</a>
<div class="page-brand">
<img class="mini-logo" src="../assets/logo-gota-de-mel.png" alt="Escola Gota de Mel">
<div><h1>Eventos da Gota de Mel</h1><small>Viver Bem</small></div>
</div>
</header>
<main class="page-content">
<section class="intro-card"><div class="intro-icon">📅</div><h2>Calendário da Escola</h2><p>Confira os próximos eventos e datas importantes da Gota de Mel.</p></section>
<section class="content-card"><h3>Próximos eventos</h3><div class="company-event-page-list" data-company-events-page><p>Carregando eventos…</p></div></section>
</main>
<footer>Viver Bem • Escola Gota de Mel</footer>
<script src="../js/eventos-internos.js"></script>
</body>
</html>
